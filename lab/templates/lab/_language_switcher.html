{% load i18n %}
<form class="language-switcher" method="post" action="{% url 'set_language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label for="interface-language">{% translate "لغة الواجهة" %}</label>
  <select id="interface-language" name="language" aria-label="{% translate 'لغة الواجهة' %}" onchange="this.form.submit()" dir="auto">
    {% get_current_language as CURRENT_LANGUAGE %}
    <option value="ar" {% if CURRENT_LANGUAGE == "ar" %}selected{% endif %}>العربية</option>
    <option value="en" {% if CURRENT_LANGUAGE == "en" %}selected{% endif %}>English</option>
    <option value="fr" {% if CURRENT_LANGUAGE == "fr" %}selected{% endif %}>Français</option>
  </select>
</form>
