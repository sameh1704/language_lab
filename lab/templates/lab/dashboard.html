<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة معمل اللغات</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #f3f4f6; margin: 0; color: #111827; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 12px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  header h1 { font-size: 20px; margin: 0; }
  header form { margin: 0; }
  .link { background: none; border: 0; color: #2563eb; cursor: pointer; font: inherit; }
  .sim { background: #fef3c7; color: #92400e; padding: 8px 20px; font-size: 14px; text-align: center; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
         padding: 12px 20px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #e5e7eb;
          padding: 4px 10px; border-radius: 999px; }
  .dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .dot.online { background: #22c55e; }
  .dot.offline { background: #e5e7eb; border: 1px solid #d1d5db; }
  .dot.absent { background: repeating-linear-gradient(45deg, #f3f4f6, #f3f4f6 3px, #d1d5db 3px, #d1d5db 6px); }
  .dot.blocked { background: #fff; border: 2px solid #dc2626; }
  .dot.selected { background: #fff; border: 2px solid #2563eb; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
                    border: 1px solid #d1d5db; background: #fff; }
  .actions button:hover { background: #f9fafb; }
  .actions .danger { background: #dc2626; border-color: #dc2626; color: #fff; }
  .actions .danger:hover { background: #b91c1c; }
  .actions .ok { background: #16a34a; border-color: #16a34a; color: #fff; }
  .actions .ok:hover { background: #15803d; }
  .sep { width: 1px; background: #d1d5db; margin: 0 4px; }

  #msg { margin: 0 20px; min-height: 22px; font-size: 14px; color: #374151; }

  #grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; padding: 12px 20px 28px; }
  @media (max-width: 1000px) { #grid { grid-template-columns: repeat(5, 1fr); } }
  @media (max-width: 600px)  { #grid { grid-template-columns: repeat(3, 1fr); } }

  .tile { position: relative; aspect-ratio: 1.3; border-radius: 12px; border: 3px solid transparent;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
          cursor: pointer; font: inherit; user-select: none; transition: transform .08s; }
  .tile:active { transform: scale(.97); }
  .tile .num { font-size: 28px; font-weight: 700; line-height: 1; }
  .tile .st { font-size: 12px; }
  .tile.online  { background: #22c55e; color: #fff; }
  .tile.offline { background: #e5e7eb; color: #9ca3af; opacity: .65; }
  .tile.absent  { background: repeating-linear-gradient(45deg, #f3f4f6, #f3f4f6 8px, #e5e7eb 8px, #e5e7eb 16px);
                  color: #6b7280; border: 2px dashed #cbd5e1; }
  .tile.blocked { box-shadow: inset 0 0 0 3px #dc2626; }
  .tile.selected { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.35); }
  .tile.blocked.selected { box-shadow: inset 0 0 0 3px #dc2626, 0 0 0 3px rgba(37,99,235,.35); }
  .tile .au { font-size: 11px; opacity: .9; }
  a.link { text-decoration: none; }
  .tile .lock { position: absolute; top: 6px; inset-inline-start: 6px; background: #dc2626; color: #fff;
                font-size: 11px; padding: 1px 7px; border-radius: 999px; }
</style>
</head>
<body>
<header>
  <h1>لوحة تحكم معمل اللغات</h1>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}
    <a class="link" href="{% url 'setup' %}">الإعدادات والاتصال</a> &middot;
    <span>{{ request.user.get_username }}</span> &middot;
    <button class="link" type="submit">تسجيل الخروج</button>
  </form>
</header>

{% if simulate %}
<div class="sim">وضع تجريبي: الحالات المعروضة وهمية ولا يتم التحكم في أي جهاز حقيقي (LAB_SIMULATE)</div>
{% endif %}

<div class="bar">
  <div class="stats">
    <span class="chip"><span class="dot online"></span>متصل <b id="c-online">0</b></span>
    <span class="chip"><span class="dot offline"></span>غير متصل <b id="c-offline">0</b></span>
    <span class="chip"><span class="dot absent"></span>غائب <b id="c-absent">0</b></span>
    <span class="chip"><span class="dot blocked"></span>محظور <b id="c-blocked">0</b></span>
    <span class="chip"><span class="dot selected"></span>محدد <b id="c-selected">0</b></span>
  </div>
  <div class="actions">
    <button data-do="select-online">تحديد المتصل</button>
    <button data-do="clear">إلغاء التحديد</button>
    <span class="sep"></span>
    <button class="danger" data-act="lock" data-scope="selected">حظر المحدد</button>
    <button class="ok" data-act="unlock" data-scope="selected">فتح المحدد</button>
    <button data-act="absent" data-scope="selected">تغييب المحدد</button>
    <button data-act="present" data-scope="selected">إلغاء التغييب</button>
    <span class="sep"></span>
    <button class="danger" data-act="lock" data-scope="all">حظر الكل</button>
    <button class="ok" data-act="unlock" data-scope="all">فتح الكل</button>
  </div>
</div>

<div class="bar" style="padding-top:0">
  <div class="stats">
    <span class="chip" id="a-state">الصوت: متوقف</span>
    <span id="a-info" style="font-size:14px;color:#374151"></span>
  </div>
  <div class="actions">
    <button id="a-power">تشغيل الصوت</button>
    <span class="sep"></span>
    <button id="a-bcast-sel">بث للمحدد</button>
    <button id="a-bcast-all">بث للكل</button>
    <button id="a-bcast-stop">إيقاف البث</button>
    <span class="sep"></span>
    <button id="a-listen">استمع للمحدد</button>
    <button id="a-talk">حوار مع المحدد</button>
    <button id="a-listen-stop">إيقاف الاستماع</button>
  </div>
</div>

<div id="msg"></div>
<div id="grid"></div>

<script>
const grid = document.getElementById('grid');
const msg = document.getElementById('msg');
let devices = [];
const selected = new Set();
let busy = false;
// حالة الصوت (تديرها كتلة الصوت أسفل الصفحة): ready = من فتح صفحة الطالب الآن
const audioInfo = { ready: new Set(), on: false, all: false, set: new Set(), listen: null };

function csrf() {
  const m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}

function render() {
  grid.textContent = '';
  let c = { online: 0, offline: 0, absent: 0, blocked: 0 };
  devices.forEach(d => {
    const state = d.absent ? 'absent' : (d.online ? 'online' : 'offline');
    c[state]++;
    if (d.blocked) c.blocked++;

    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile ' + state + (d.blocked ? ' blocked' : '') + (selected.has(d.number) ? ' selected' : '');
    if (d.name) b.title = d.name;

    const num = document.createElement('span');
    num.className = 'num'; num.textContent = d.number;
    const st = document.createElement('span');
    st.className = 'st';
    st.textContent = state === 'absent' ? 'غائب' : (state === 'online' ? 'متصل' : 'غير متصل');
    b.append(num, st);
    let au = '';
    if (audioInfo.listen === d.number) au = 'نستمع إليه';
    else if (audioInfo.ready.has(d.number) && audioInfo.on && (audioInfo.all || audioInfo.set.has(d.number))) au = 'يسمعك';
    else if (audioInfo.ready.has(d.number)) au = 'صوت جاهز';
    if (au) {
      const a = document.createElement('span');
      a.className = 'au'; a.textContent = au;
      b.append(a);
    }
    if (d.blocked) {
      const lock = document.createElement('span');
      lock.className = 'lock'; lock.textContent = 'محظور';
      b.append(lock);
    }
    b.addEventListener('click', () => {
      selected.has(d.number) ? selected.delete(d.number) : selected.add(d.number);
      render();
    });
    grid.append(b);
  });
  for (const k of ['online', 'offline', 'absent', 'blocked']) {
    document.getElementById('c-' + k).textContent = c[k];
  }
  document.getElementById('c-selected').textContent = selected.size;
}

async function refresh() {
  if (busy) return;
  try {
    const r = await fetch('/api/status/', { headers: { 'Accept': 'application/json' } });
    if (r.status === 401 || r.status === 403 || r.redirected) { location.reload(); return; }
    const data = await r.json();
    devices = data.devices;
    render();
  } catch (e) {
    msg.textContent = 'تعذر تحديث الحالة، تأكد أن الخادم يعمل.';
  }
}

function summarize(act, res) {
  const verb = { lock: 'حظر', unlock: 'فتح', absent: 'تغييب', present: 'إلغاء تغييب' }[act];
  const parts = [`تم ${verb} ${res.done.length} جهاز`];
  if (res.skipped.length) {
    parts.push('تم تخطي: ' + res.skipped.map(s => `${s.number} (${s.reason})`).join('، '));
  }
  if (res.failed.length) {
    parts.push('فشل: ' + res.failed.map(f => `${f.number} (${f.error})`).join('، '));
  }
  return parts.join(' — ');
}

async function act(action, scope) {
  const numbers = scope === 'all' ? devices.map(d => d.number) : [...selected];
  if (!numbers.length) { msg.textContent = 'حدد جهازًا واحدًا على الأقل أولاً.'; return; }
  busy = true;
  msg.textContent = 'جارٍ التنفيذ...';
  try {
    const r = await fetch('/api/action/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
      body: JSON.stringify({ action, numbers }),
    });
    const res = await r.json();
    msg.textContent = r.ok ? summarize(action, res) : (res.error || 'حدث خطأ');
  } catch (e) {
    msg.textContent = 'تعذر تنفيذ الأمر.';
  } finally {
    busy = false;
    refresh();
  }
}

document.querySelectorAll('[data-act]').forEach(btn =>
  btn.addEventListener('click', () => act(btn.dataset.act, btn.dataset.scope)));
document.querySelector('[data-do="clear"]').addEventListener('click', () => { selected.clear(); render(); });
document.querySelector('[data-do="select-online"]').addEventListener('click', () => {
  devices.filter(d => d.online && !d.absent).forEach(d => selected.add(d.number));
  render();
});

refresh();
setInterval(refresh, 4000);
</script>
{% include "lab/_teacher_audio.html" %}
</body>
</html>
