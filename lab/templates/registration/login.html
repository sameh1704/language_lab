<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول المعلم</title>
<style>
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #f3f4f6; margin: 0;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  form { background: #fff; padding: 28px 32px; border-radius: 14px; width: 320px;
         box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 18px; }
  label { display: block; font-size: 14px; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d1d5db;
          border-radius: 8px; font-size: 15px; }
  button { margin-top: 18px; width: 100%; padding: 11px; border: 0; border-radius: 8px;
           background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  .err { color: #dc2626; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<form method="post">
  {% csrf_token %}
  <h1>لوحة تحكم معمل اللغات</h1>
  <label for="id_username">اسم المستخدم</label>
  <input type="text" name="username" id="id_username" autofocus required>
  <label for="id_password">كلمة المرور</label>
  <input type="password" name="password" id="id_password" required>
  {% if form.errors %}<div class="err">اسم المستخدم أو كلمة المرور غير صحيحة.</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">دخول</button>
</form>
</body>
</html>
